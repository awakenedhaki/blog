# Build the site and publish it to GitHub Pages on every push to main.
#
# One-time repository setting: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". The custom domain comes from static/CNAME.
#
# The build is the gate: its prebuild hooks stop on a draft in src/posts, a
# figure damaged by the pipeline, or a figure with no alt text. The test
# suite is not run here: it builds against the local-only archive of example
# posts, which is not in the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Published posts only, so a draft in content/ can never ship.
      - run: npm run sync

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
